<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- 이 화면이 불러올 수 있는 것을 좁혀 둡니다. Firebase 프로젝트(authDomain)가 바뀌면 frame-src 의 주소도 함께 바꿉니다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://kyla-homepage.firebaseapp.com; base-uri 'none'; form-action 'none'">
<title>관리자 | KYLA 한국유소년라크로스협회</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&family=Kanit:ital,wght@0,400;0,600;1,600;1,800&display=swap">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="adm">

<header class="adm-bar">
  <div class="adm-bar__in">
    <a class="adm-bar__brand" href="../" aria-label="KYLA 홈페이지로 가기">
      <img src="../assets/img/kyla-mark.png" alt="KYLA" width="334" height="101">
      <span>관리자</span>
    </a>
    <div class="adm-bar__who" id="adm-who" hidden>
      <span id="adm-email"></span>
      <button class="linkbtn" type="button" id="adm-signout">로그아웃</button>
    </div>
  </div>
</header>

<!-- 들어오기 전: 확인하는 중, 로그인, 권한 없음 -->
<div class="adm-gates" id="adm-gates">

  <section class="adm-gate" id="adm-loading" aria-live="polite">
    <p class="adm-gate__text">로그인 상태를 확인하고 있습니다.</p>
  </section>

  <section class="adm-gate" id="adm-signin" hidden>
    <h1 class="t-2" tabindex="-1">관리자 로그인</h1>
    <p class="adm-gate__text">협회가 관리자로 등록한 구글 계정으로만 들어올 수 있습니다.</p>
    <div class="btns"><button class="btn" type="button" id="adm-google">구글 계정으로 로그인</button></div>
    <p class="adm-gate__msg" id="adm-signin-msg" role="alert" hidden></p>
    <p class="adm-gate__hint">카카오톡이나 인스타그램 안에서 연 화면에서는 구글 로그인이 막힙니다. Chrome이나 Safari에서 열어 주세요.</p>
  </section>

  <!-- 제목과 본문은 상황에 따라 admin/core.js 가 채웁니다 -->
  <section class="adm-gate" id="adm-denied" hidden>
    <h1 class="t-2" tabindex="-1" id="adm-denied-title">이 계정에는 관리자 권한이 없습니다</h1>
    <p class="adm-gate__text" id="adm-denied-text"></p>
    <div class="btns">
      <button class="btn" type="button" id="adm-recheck" hidden>다시 확인</button>
      <button class="btn btn--ghost" type="button" id="adm-switch">다른 계정으로 로그인</button>
    </div>
    <p class="adm-gate__msg" id="adm-denied-msg" role="alert" hidden></p>
  </section>

</div>

<!-- 들어온 뒤: 메뉴와 화면. 메뉴와 각 화면은 assets/js/admin/ 의 파일들이 만듭니다 -->
<div class="adm-shell" id="adm-app" hidden>
  <nav class="adm-nav" id="adm-nav" aria-label="관리 메뉴"></nav>
  <main class="adm-main" id="main"></main>
</div>

<!-- 추가·수정 창 -->
<dialog class="adm-dlg" id="adm-dlg" aria-labelledby="adm-dlg-title">
  <form method="dialog" class="adm-dlg__box" id="adm-dlg-form" novalidate>
    <header class="adm-dlg__head">
      <h2 class="t-3" id="adm-dlg-title"></h2>
      <button class="adm-x" type="button" id="adm-dlg-x" aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    </header>
    <div class="adm-dlg__body" id="adm-dlg-body"></div>
    <p class="adm-dlg__msg" id="adm-dlg-msg" role="alert" hidden></p>
    <footer class="adm-dlg__foot" id="adm-dlg-foot"></footer>
  </form>
</dialog>

<!-- 되묻는 창 -->
<dialog class="adm-dlg adm-dlg--ask" id="adm-ask" aria-labelledby="adm-ask-title">
  <div class="adm-dlg__box">
    <h2 class="t-3" id="adm-ask-title"></h2>
    <p class="adm-ask__text" id="adm-ask-text"></p>
    <div class="adm-dlg__foot">
      <button class="linkbtn" type="button" id="adm-ask-no">취소</button>
      <button class="btn btn--sm" type="button" id="adm-ask-yes"></button>
    </div>
  </div>
</dialog>

<div class="adm-toast" id="adm-toast" role="status" aria-live="polite"></div>
<div class="adm-tip" id="adm-tip" role="tooltip" hidden></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/vendor/firebase-app-compat.js"></script>
<script src="../assets/vendor/firebase-auth-compat.js"></script>
<script src="../assets/js/admin/core.js"></script>
<script src="../assets/js/admin/home.js"></script>
<script src="../assets/js/admin/members.js"></script>
<script src="../assets/js/admin/inquiries.js"></script>
<script src="../assets/js/admin/matches.js"></script>
<script src="../assets/js/admin/eoi.js"></script>
<script src="../assets/js/admin/intl.js"></script>
<script src="../assets/js/admin/admins.js"></script>
<script src="../assets/js/admin/start.js"></script>
</body>
</html>
