<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | Page not found | KYLA</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff;color:#14213F;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Hiragino Sans","Yu Gothic",sans-serif}
  main{max-width:420px}
  img{display:block;width:150px;height:auto;margin-bottom:28px}
  section + section{margin-top:36px;padding-top:28px;border-top:1px solid #D5DCE8}
  section[lang="ko"]{word-break:keep-all}
  h1{margin:0;font-size:28px;line-height:1.3}
  p{margin:12px 0 24px;line-height:1.7;color:#56627A}
  a{display:inline-block;padding:14px 24px;background:#D0111B;color:#fff;font-weight:800;text-decoration:none}
  [hidden]{display:none}
</style>
</head>
<body>
<main>
  <img src="/assets/img/kyla-mark.png" alt="KYLA" width="334" height="101">
  <section lang="ko">
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 잘못 입력되었습니다. 홈에서 공지사항과 일정을 확인해 주세요.</p>
    <a href="/">KYLA 홈으로 가기</a>
  </section>
  <section lang="en">
    <h1>Page not found</h1>
    <p>The address has changed or was typed incorrectly. Please check notices and the schedule from the home page.</p>
    <a href="/en/">Go to the KYLA home page</a>
  </section>
  <section lang="ja">
    <h1>ページが見つかりません</h1>
    <p>アドレスが変更されたか、入力に誤りがあります。ホームからお知らせと日程をご確認ください。</p>
    <a href="/ja/">KYLAホームへ</a>
  </section>
</main>
<script>
  // 주소가 /en/ 이나 /ja/ 로 시작하면 그 언어 안내만 보여 줍니다.
  (function () {
    var m = location.pathname.match(/^\/(en|ja)(\/|$)/), lang = m ? m[1] : 'ko';
    document.documentElement.lang = lang;
    [].forEach.call(document.querySelectorAll('section'), function (s) { s.hidden = s.lang !== lang; });
  })();
</script>
</body>
</html>
